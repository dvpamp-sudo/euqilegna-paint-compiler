<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Gallery</title>
<style>body{margin:0;background:#0a080b;color:#f4e7d5;font-family:Arial}.wrap{max-width:1200px;margin:auto;padding:28px}.back{color:#d9ac58}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin:25px 0}.head h1{font-family:Georgia,serif;font-size:48px;margin:0}.btn{padding:12px 15px;border-radius:10px;background:#8e43ba;color:#fff;border:0;font-weight:900;cursor:pointer}.form{display:none;background:#171218;border:1px solid #503a28;border-radius:17px;padding:18px;margin-bottom:20px}.form.show{display:block}.form input,.form textarea{width:100%;padding:10px;margin:6px 0 12px;border:1px solid #59422e;border-radius:9px;background:#0c090d;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.art{background:#151116;border:1px solid #493625;border-radius:17px;overflow:hidden}.art img{width:100%;height:260px;object-fit:cover}.copy{padding:16px}.copy h3{font-family:Georgia,serif;font-size:24px;margin:0 0 6px}.copy p{color:#c2b19d}.empty{grid-column:1/-1;text-align:center;padding:60px;border:1px dashed #60472e;border-radius:18px;color:#bfae9a}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.head{display:block}.head .btn{margin-top:12px}}</style></head>
<body><div class="wrap"><a class="back" href="/">← Digital Art Studio</a><header class="head"><div><h1>My Gallery</h1><p>Preserve completed work, memories, titles, and creative notes.</p></div><button class="btn" id="add">Add Gallery Record</button></header>
<section id="form" class="form"><label>Artwork title<input id="title" placeholder="Midnight Reflection"></label><label>Image URL or collection cover<input id="image" value="/samples/covers/midnight-jazz.jpg"></label><label>Creative notes<textarea id="notes" placeholder="What did this painting mean to you?"></textarea></label><button class="btn" id="save">Save to My Gallery</button></section>
<main id="grid" class="grid"></main></div><script>
const key='euqilegna-my-gallery-v1';let records=[];try{records=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}
function render(){grid.innerHTML='';if(!records.length){grid.innerHTML='<div class="empty"><h2>Your personal gallery is ready.</h2><p>Complete artwork or add a beta gallery record to preview the experience.</p></div>';return}records.slice().reverse().forEach(r=>{const a=document.createElement('article');a.className='art';a.innerHTML=`<img src="${r.image}"><div class="copy"><h3>${r.title}</h3><small>${new Date(r.date).toLocaleDateString()}</small><p>${r.notes||''}</p></div>`;grid.appendChild(a)})}
add.onclick=()=>form.classList.toggle('show');save.onclick=()=>{records.push({title:title.value||'Untitled Artwork',image:image.value||'/samples/covers/midnight-jazz.jpg',notes:notes.value,date:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(records));form.classList.remove('show');render()};render();</script></body></html>
