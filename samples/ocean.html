<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ocean Waves</title><style>body{margin:0;font-family:Arial,sans-serif;background:#fff8f1;color:#2b190f}header{padding:16px 20px;background:white;border-bottom:1px solid #ead6c5}header a{color:#9c4a22;text-decoration:none;font-weight:700}.app{display:grid;grid-template-columns:minmax(0,1fr) 280px;min-height:calc(100vh - 70px)}.stage{display:flex;align-items:center;justify-content:center;padding:18px;background:#f2ece7}.board{width:min(90vw,700px);background:white;box-shadow:0 10px 30px #0002}.board svg{width:100%;height:auto;display:block}.r{fill:#fff;stroke:#2b2b2b;stroke-width:3;cursor:pointer;transition:fill .2s}.panel{background:white;border-left:1px solid #ead6c5;padding:18px}.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.swatch{height:58px;border-radius:10px;border:3px solid transparent;font-weight:800;cursor:pointer}.swatch.active{border-color:#111;box-shadow:0 0 0 3px #ddd}.progress{height:12px;background:#eee;border-radius:999px;overflow:hidden;margin:10px 0 18px}.bar{height:100%;background:#9c4a22;width:0}button{border:0;border-radius:8px;padding:10px 12px;font-weight:700;cursor:pointer}@media(max-width:760px){.app{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid #ead6c5}}</style></head><body><header><a href="/samples">← Basic Design Library</a><h1>Ocean Waves</h1><p>Smooth curves and simple water tones.</p></header><div class="app"><main class="stage"><div class="board"><svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg"><rect class="r" data-c="1" x="0" y="0" width="600" height="150"/><path class="r" data-c="2" d="M0 180 Q100 100 200 180 T400 180 T600 180 L600 300 L0 300 Z"/><path class="r" data-c="3" d="M0 280 Q100 200 200 280 T400 280 T600 280 L600 400 L0 400 Z"/><path class="r" data-c="4" d="M0 380 Q100 300 200 380 T400 380 T600 380 L600 500 L0 500 Z"/><path class="r" data-c="5" d="M0 480 Q100 400 200 480 T400 480 T600 480 L600 600 L0 600 Z"/></svg></div></main><aside class="panel"><h2>Choose a color</h2><div id="palette" class="palette"></div><p id="status">Select a number, then tap matching sections.</p><strong id="count">0 / 0 complete</strong><div class="progress"><div id="bar" class="bar"></div></div><button id="reset">Reset Design</button></aside></div><script>const colors=["#90E0EF", "#48CAE4", "#00B4D8", "#0077B6", "#023E8A"];let selected=1;let painted=new Set();const regions=[...document.querySelectorAll('.r')];regions.forEach((r,i)=>{r.dataset.id='r'+i;const b=r.getBBox();const tx=document.createElementNS('http://www.w3.org/2000/svg','text');tx.setAttribute('x',b.x+b.width/2);tx.setAttribute('y',b.y+b.height/2);tx.setAttribute('text-anchor','middle');tx.setAttribute('dominant-baseline','middle');tx.setAttribute('font-size','24');tx.setAttribute('font-weight','800');tx.setAttribute('pointer-events','none');tx.textContent=r.dataset.c;r.parentNode.appendChild(tx);r.addEventListener('click',()=>{if(Number(r.dataset.c)!==selected){document.getElementById('status').textContent='Try color '+r.dataset.c+' for that section.';return;}r.style.fill=colors[selected-1];painted.add(r.dataset.id);tx.style.display='none';update();});});function renderPalette(){const h=document.getElementById('palette');h.innerHTML='';colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch'+(selected===i+1?' active':'');b.style.background=c;b.textContent=i+1;b.onclick=()=>{selected=i+1;renderPalette();document.getElementById('status').textContent='Color '+selected+' selected.';};h.appendChild(b);});}function update(){const total=regions.length,done=painted.size;document.getElementById('count').textContent=done+' / '+total+' complete';document.getElementById('bar').style.width=(done/total*100)+'%';if(done===total)document.getElementById('status').textContent='Complete! Beautiful work.';}document.getElementById('reset').onclick=()=>location.reload();renderPalette();update();</script></body></html>
