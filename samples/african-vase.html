<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnolia Branches</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f0ea;color:#241913}header{padding:18px 24px;background:white;border-bottom:1px solid #ddd}
header h1{font-family:Georgia,serif;margin:8px 0}header a{color:#8b3f1f;text-decoration:none;font-weight:700}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 130px)}.stage{display:flex;align-items:center;justify-content:center;padding:24px;background:#eee6df}
.board{width:min(92vw,900px);background:white;box-shadow:0 12px 28px #0002}svg{width:100%;height:auto;display:block}
.r{fill:#fff;stroke:#1f1f1f;stroke-width:2.4;vector-effect:non-scaling-stroke;cursor:pointer}.panel{padding:20px;background:#fff;border-left:1px solid #ddd}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.swatch{height:58px;border:3px solid transparent;border-radius:10px;font-weight:800;cursor:pointer}
.swatch.active{border-color:#111;box-shadow:0 0 0 3px #ddd}.barwrap{height:12px;background:#eee;border-radius:999px;overflow:hidden}.bar{height:100%;background:#8b3f1f;width:0}
@media(max-width:780px){.app{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid #ddd}}</style></head>
<body><header><a href="/samples">← Premium Adult Library</a><h1>Magnolia Branches</h1><strong>Intermediate</strong><p>Graceful magnolia flowers arranged along a sweeping botanical branch.</p></header>
<div class="app"><main class="stage"><div class="board"><svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="600" fill="#fff"/><ellipse class="r" data-c="2" cx="250.0" cy="190.0" rx="35" ry="85" transform="rotate(0 250.0 190.0)"/><ellipse class="r" data-c="3" cx="292.42640687119285" cy="207.57359312880715" rx="35" ry="85" transform="rotate(45 292.42640687119285 207.57359312880715)"/><ellipse class="r" data-c="4" cx="310.0" cy="250.0" rx="35" ry="85" transform="rotate(90 310.0 250.0)"/><ellipse class="r" data-c="5" cx="292.42640687119285" cy="292.42640687119285" rx="35" ry="85" transform="rotate(135 292.42640687119285 292.42640687119285)"/><ellipse class="r" data-c="2" cx="250.0" cy="310.0" rx="35" ry="85" transform="rotate(180 250.0 310.0)"/><ellipse class="r" data-c="3" cx="207.57359312880715" cy="292.42640687119285" rx="35" ry="85" transform="rotate(225 207.57359312880715 292.42640687119285)"/><ellipse class="r" data-c="4" cx="190.0" cy="250.0" rx="35" ry="85" transform="rotate(270 190.0 250.0)"/><ellipse class="r" data-c="5" cx="207.57359312880715" cy="207.57359312880715" rx="35" ry="85" transform="rotate(315 207.57359312880715 207.57359312880715)"/><ellipse class="r" data-c="6" cx="250" cy="250" rx="24" ry="24" transform="rotate(0 250 250)"/><ellipse class="r" data-c="2" cx="540.0" cy="276.0" rx="31.5" ry="76.5" transform="rotate(0 540.0 276.0)"/><ellipse class="r" data-c="3" cx="578.1837661840735" cy="291.81623381592647" rx="31.5" ry="76.5" transform="rotate(45 578.1837661840735 291.81623381592647)"/><ellipse class="r" data-c="4" cx="594.0" cy="330.0" rx="31.5" ry="76.5" transform="rotate(90 594.0 330.0)"/><ellipse class="r" data-c="5" cx="578.1837661840735" cy="368.18376618407353" rx="31.5" ry="76.5" transform="rotate(135 578.1837661840735 368.18376618407353)"/><ellipse class="r" data-c="2" cx="540.0" cy="384.0" rx="31.5" ry="76.5" transform="rotate(180 540.0 384.0)"/><ellipse class="r" data-c="3" cx="501.81623381592647" cy="368.1837661840736" rx="31.5" ry="76.5" transform="rotate(225 501.81623381592647 368.1837661840736)"/><ellipse class="r" data-c="4" cx="486.0" cy="330.0" rx="31.5" ry="76.5" transform="rotate(270 486.0 330.0)"/><ellipse class="r" data-c="5" cx="501.8162338159264" cy="291.81623381592647" rx="31.5" ry="76.5" transform="rotate(315 501.8162338159264 291.81623381592647)"/><ellipse class="r" data-c="6" cx="540" cy="330" rx="21.6" ry="21.6" transform="rotate(0 540 330)"/><ellipse class="r" data-c="2" cx="400.0" cy="405.0" rx="26.25" ry="63.75" transform="rotate(0 400.0 405.0)"/><ellipse class="r" data-c="3" cx="431.81980515339467" cy="418.1801948466054" rx="26.25" ry="63.75" transform="rotate(45 431.81980515339467 418.1801948466054)"/><ellipse class="r" data-c="4" cx="445.0" cy="450.0" rx="26.25" ry="63.75" transform="rotate(90 445.0 450.0)"/><ellipse class="r" data-c="5" cx="431.81980515339467" cy="481.8198051533946" rx="26.25" ry="63.75" transform="rotate(135 431.81980515339467 481.8198051533946)"/><ellipse class="r" data-c="2" cx="400.0" cy="495.0" rx="26.25" ry="63.75" transform="rotate(180 400.0 495.0)"/><ellipse class="r" data-c="3" cx="368.1801948466054" cy="481.81980515339467" rx="26.25" ry="63.75" transform="rotate(225 368.1801948466054 481.81980515339467)"/><ellipse class="r" data-c="4" cx="355.0" cy="450.0" rx="26.25" ry="63.75" transform="rotate(270 355.0 450.0)"/><ellipse class="r" data-c="5" cx="368.18019484660533" cy="418.1801948466054" rx="26.25" ry="63.75" transform="rotate(315 368.18019484660533 418.1801948466054)"/><ellipse class="r" data-c="6" cx="400" cy="450" rx="18.0" ry="18.0" transform="rotate(0 400 450)"/><path class="r" data-c="9" d="M80 520 Q250 420 380 310 Q520 190 730 100 L750 130 Q550 240 410 340 Q250 470 100 550Z"/><ellipse class="r" data-c="7" cx="160" cy="430" rx="30" ry="85" transform="rotate(-40 160 430)"/><ellipse class="r" data-c="8" cx="310" cy="350" rx="30" ry="85" transform="rotate(-25 310 350)"/><ellipse class="r" data-c="7" cx="500" cy="230" rx="30" ry="85" transform="rotate(-30 500 230)"/><ellipse class="r" data-c="8" cx="650" cy="150" rx="30" ry="85" transform="rotate(-20 650 150)"/></svg></div></main><aside class="panel"><h2>Paint palette</h2><div id="palette" class="palette"></div>
<p id="status">Select a color and complete all matching regions.</p><strong id="count"></strong><div class="barwrap"><div id="bar" class="bar"></div></div></aside></div>
<script>
const colors=["#2A2633", "#73546F", "#A96F7B", "#D18B87", "#E7B49A", "#D6B76D", "#71855E", "#496653", "#8B6E55"];let selected=1;const painted=new Set();const regions=[...document.querySelectorAll('.r')];
regions.forEach((r,i)=>{r.dataset.id='r'+i;const b=r.getBBox();const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',b.x+b.width/2);t.setAttribute('y',b.y+b.height/2);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-size',Math.max(12,Math.min(24,Math.min(b.width,b.height)*.28)));t.setAttribute('font-weight','700');t.setAttribute('pointer-events','none');t.textContent=r.dataset.c;r.parentNode.appendChild(t);r._label=t;
r.onclick=()=>{if(Number(r.dataset.c)!==selected){status.textContent='Finish color '+selected+' first.';return;}r.style.fill=colors[selected-1];painted.add(r.dataset.id);t.style.display='none';update();};});
function render(){palette.innerHTML='';colors.forEach((c,i)=>{const n=i+1;const total=regions.filter(r=>+r.dataset.c===n).length;const done=regions.filter(r=>+r.dataset.c===n&&painted.has(r.dataset.id)).length;const b=document.createElement('button');b.className='swatch'+(selected===n?' active':'');b.style.background=c;b.textContent=n+' '+done+'/'+total;b.onclick=()=>{const current=regions.filter(r=>+r.dataset.c===selected);if(current.some(r=>!painted.has(r.dataset.id))){status.textContent='Finish color '+selected+' first.';return;}selected=n;render();};palette.appendChild(b);});}
function update(){count.textContent=painted.size+' / '+regions.length+' regions complete';bar.style.width=(painted.size/regions.length*100)+'%';const cur=regions.filter(r=>+r.dataset.c===selected);if(cur.length&&cur.every(r=>painted.has(r.dataset.id))){const next=[...new Set(regions.filter(r=>!painted.has(r.dataset.id)).map(r=>+r.dataset.c))][0];if(next)selected=next;}render();if(painted.size===regions.length)status.textContent='Complete — your finished botanical artwork is ready.';}
render();update();
</script></body></html>
