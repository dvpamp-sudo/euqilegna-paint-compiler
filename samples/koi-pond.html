<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elegant Lily Bouquet</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f6f0ea;color:#241913}header{padding:18px 24px;background:white;border-bottom:1px solid #ddd}
header h1{font-family:Georgia,serif;margin:8px 0}header a{color:#8b3f1f;text-decoration:none;font-weight:700}
.app{display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:calc(100vh - 130px)}.stage{display:flex;align-items:center;justify-content:center;padding:24px;background:#eee6df}
.board{width:min(92vw,900px);background:white;box-shadow:0 12px 28px #0002}svg{width:100%;height:auto;display:block}
.r{fill:#fff;stroke:#1f1f1f;stroke-width:2.4;vector-effect:non-scaling-stroke;cursor:pointer}.panel{padding:20px;background:#fff;border-left:1px solid #ddd}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.swatch{height:58px;border:3px solid transparent;border-radius:10px;font-weight:800;cursor:pointer}
.swatch.active{border-color:#111;box-shadow:0 0 0 3px #ddd}.barwrap{height:12px;background:#eee;border-radius:999px;overflow:hidden}.bar{height:100%;background:#8b3f1f;width:0}
@media(max-width:780px){.app{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid #ddd}}</style></head>
<body><header><a href="/samples">← Premium Adult Library</a><h1>Elegant Lily Bouquet</h1><strong>Intermediate</strong><p>Three layered lilies with long petals and balanced botanical shapes.</p></header>
<div class="app"><main class="stage"><div class="board"><svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg"><rect width="800" height="600" fill="#fff"/><ellipse class="r" data-c="2" cx="329.5466594928129" cy="271.3650287526185" rx="38" ry="105" transform="rotate(75 329.5466594928129 271.3650287526185)"/><ellipse class="r" data-c="3" cx="310.91168824543144" cy="340.91168824543144" rx="38" ry="105" transform="rotate(135 310.91168824543144 340.91168824543144)"/><ellipse class="r" data-c="4" cx="241.3650287526185" cy="359.5466594928129" rx="38" ry="105" transform="rotate(195 241.3650287526185 359.5466594928129)"/><ellipse class="r" data-c="5" cx="190.45334050718708" cy="308.6349712473815" rx="38" ry="105" transform="rotate(255 190.45334050718708 308.6349712473815)"/><ellipse class="r" data-c="6" cx="209.08831175456856" cy="239.08831175456856" rx="38" ry="105" transform="rotate(315 209.08831175456856 239.08831175456856)"/><ellipse class="r" data-c="3" cx="278.6349712473815" cy="220.45334050718708" rx="38" ry="105" transform="rotate(375 278.6349712473815 220.45334050718708)"/><ellipse class="r" data-c="1" cx="260" cy="290" rx="28" ry="28" transform="rotate(0 260 290)"/><ellipse class="r" data-c="2" cx="589.546659492813" cy="318.6349712473815" rx="38" ry="105" transform="rotate(105 589.546659492813 318.6349712473815)"/><ellipse class="r" data-c="3" cx="538.6349712473815" cy="369.5466594928129" rx="38" ry="105" transform="rotate(165 538.6349712473815 369.5466594928129)"/><ellipse class="r" data-c="4" cx="469.08831175456856" cy="350.91168824543144" rx="38" ry="105" transform="rotate(225 469.08831175456856 350.91168824543144)"/><ellipse class="r" data-c="5" cx="450.4533405071871" cy="281.3650287526185" rx="38" ry="105" transform="rotate(285 450.4533405071871 281.3650287526185)"/><ellipse class="r" data-c="6" cx="501.3650287526185" cy="230.45334050718708" rx="38" ry="105" transform="rotate(345 501.3650287526185 230.45334050718708)"/><ellipse class="r" data-c="3" cx="570.9116882454314" cy="249.08831175456856" rx="38" ry="105" transform="rotate(405 570.9116882454314 249.08831175456856)"/><ellipse class="r" data-c="1" cx="520" cy="300" rx="28" ry="28" transform="rotate(0 520 300)"/><ellipse class="r" data-c="2" cx="462.0" cy="420.0" rx="38" ry="105" transform="rotate(90 462.0 420.0)"/><ellipse class="r" data-c="3" cx="426.0" cy="482.3538290724796" rx="38" ry="105" transform="rotate(150 426.0 482.3538290724796)"/><ellipse class="r" data-c="4" cx="354.0" cy="482.3538290724796" rx="38" ry="105" transform="rotate(210 354.0 482.3538290724796)"/><ellipse class="r" data-c="5" cx="318.0" cy="420.0" rx="38" ry="105" transform="rotate(270 318.0 420.0)"/><ellipse class="r" data-c="6" cx="354.0" cy="357.6461709275204" rx="38" ry="105" transform="rotate(330 354.0 357.6461709275204)"/><ellipse class="r" data-c="3" cx="426.0" cy="357.6461709275204" rx="38" ry="105" transform="rotate(390 426.0 357.6461709275204)"/><ellipse class="r" data-c="1" cx="390" cy="420" rx="28" ry="28" transform="rotate(0 390 420)"/><ellipse class="r" data-c="7" cx="110" cy="420" rx="35" ry="100" transform="rotate(-35 110 420)"/><ellipse class="r" data-c="8" cx="160" cy="510" rx="35" ry="100" transform="rotate(-20 160 510)"/><ellipse class="r" data-c="7" cx="690" cy="420" rx="35" ry="100" transform="rotate(35 690 420)"/><ellipse class="r" data-c="8" cx="640" cy="510" rx="35" ry="100" transform="rotate(20 640 510)"/><ellipse class="r" data-c="7" cx="400" cy="100" rx="35" ry="100" transform="rotate(0 400 100)"/></svg></div></main><aside class="panel"><h2>Paint palette</h2><div id="palette" class="palette"></div>
<p id="status">Select a color and complete all matching regions.</p><strong id="count"></strong><div class="barwrap"><div id="bar" class="bar"></div></div></aside></div>
<script>
const colors=["#2A2633", "#73546F", "#A96F7B", "#D18B87", "#E7B49A", "#D6B76D", "#71855E", "#496653", "#8B6E55"];let selected=1;const painted=new Set();const regions=[...document.querySelectorAll('.r')];
regions.forEach((r,i)=>{r.dataset.id='r'+i;const b=r.getBBox();const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',b.x+b.width/2);t.setAttribute('y',b.y+b.height/2);t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.setAttribute('font-size',Math.max(12,Math.min(24,Math.min(b.width,b.height)*.28)));t.setAttribute('font-weight','700');t.setAttribute('pointer-events','none');t.textContent=r.dataset.c;r.parentNode.appendChild(t);r._label=t;
r.onclick=()=>{if(Number(r.dataset.c)!==selected){status.textContent='Finish color '+selected+' first.';return;}r.style.fill=colors[selected-1];painted.add(r.dataset.id);t.style.display='none';update();};});
function render(){palette.innerHTML='';colors.forEach((c,i)=>{const n=i+1;const total=regions.filter(r=>+r.dataset.c===n).length;const done=regions.filter(r=>+r.dataset.c===n&&painted.has(r.dataset.id)).length;const b=document.createElement('button');b.className='swatch'+(selected===n?' active':'');b.style.background=c;b.textContent=n+' '+done+'/'+total;b.onclick=()=>{const current=regions.filter(r=>+r.dataset.c===selected);if(current.some(r=>!painted.has(r.dataset.id))){status.textContent='Finish color '+selected+' first.';return;}selected=n;render();};palette.appendChild(b);});}
function update(){count.textContent=painted.size+' / '+regions.length+' regions complete';bar.style.width=(painted.size/regions.length*100)+'%';const cur=regions.filter(r=>+r.dataset.c===selected);if(cur.length&&cur.every(r=>painted.has(r.dataset.id))){const next=[...new Set(regions.filter(r=>!painted.has(r.dataset.id)).map(r=>+r.dataset.c))][0];if(next)selected=next;}render();if(painted.size===regions.length)status.textContent='Complete — your finished botanical artwork is ready.';}
render();update();
</script></body></html>
