services:
  web:
    image: python:3.13-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - PYTHONUNBUFFERED=1
      - EUQILEGNA_DATA_DIR=/app/.data
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python -m uvicorn main:app --host 0.0.0.0 --port 3000 --reload"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: on-failure
