services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.base44
    container_name: euqilegna-web
    ports:
      - "3000:3000"
    environment:
      - EUQILEGNA_DATA_DIR=/var/data/euqilegna
      - PYTHONUNBUFFERED=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
    volumes:
      - .:/app
      - euqilegna_data:/var/data/euqilegna
    restart: on-failure
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      start_period: 20s
      retries: 5

volumes:
  euqilegna_data:
